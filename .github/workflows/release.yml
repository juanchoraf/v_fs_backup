name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.8"
        required: true
        type: string

permissions:
  actions: read
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            os: linux
            arch: x86_64
            shell: bash
            binary: target/release/v_fs_backup
            extension: ""
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
            shell: bash
            binary: target/release/v_fs_backup
            extension: ""
          - name: macos-x86_64
            runner: macos-15-intel
            os: macos
            arch: x86_64
            shell: bash
            binary: target/release/v_fs_backup
            extension: ""
          - name: macos-arm64
            runner: macos-15
            os: macos
            arch: arm64
            shell: bash
            binary: target/release/v_fs_backup
            extension: ""
          - name: windows-x86_64
            runner: windows-2025
            os: windows
            arch: x86_64
            shell: pwsh
            binary: target/release/v_fs_backup.exe
            extension: ".exe"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}

      - name: Install Rust
        shell: bash
        timeout-minutes: 10
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: release-${{ matrix.name }}

      - name: Check tag matches Cargo version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | sed -n '1p')
          tag_version="${RELEASE_TAG#v}"
          if [ "$version" != "$tag_version" ]; then
            echo "Cargo.toml version $version does not match release tag $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Build release binary
        shell: ${{ matrix.shell }}
        timeout-minutes: 20
        run: cargo build --release --locked

      - name: Package release binary on Unix
        if: matrix.shell == 'bash'
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | sed -n '1p')
          versioned_name="v_fs_backup_v${version}"
          artifact="${versioned_name}_${{ matrix.os }}_${{ matrix.arch }}${{ matrix.extension }}"
          out_dir="versions/${versioned_name}"

          mkdir -p "$out_dir"
          cp "${{ matrix.binary }}" "$out_dir/$artifact"
          chmod 0755 "$out_dir/$artifact"

          if command -v sha256sum >/dev/null 2>&1; then
            (
              cd "$out_dir"
              sha256sum "$artifact" > "$artifact.sha256"
            )
          else
            (
              cd "$out_dir"
              shasum -a 256 "$artifact" > "$artifact.sha256"
            )
          fi

      - name: Package release binary on Windows
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          $versionLine = Select-String -Path Cargo.toml -Pattern '^\s*version\s*=\s*"([^"]+)"' | Select-Object -First 1
          if (-not $versionLine) {
            throw "Unable to read package version from Cargo.toml"
          }

          $version = $versionLine.Matches[0].Groups[1].Value
          $versionedName = "v_fs_backup_v$version"
          $artifact = "${versionedName}_${{ matrix.os }}_${{ matrix.arch }}${{ matrix.extension }}"
          $outDir = Join-Path "versions" $versionedName
          $outPath = Join-Path $outDir $artifact

          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          Copy-Item "${{ matrix.binary }}" $outPath -Force

          $hash = (Get-FileHash -Algorithm SHA256 -Path $outPath).Hash.ToLowerInvariant()
          Set-Content -Encoding ASCII -Path "$outPath.sha256" -Value "$hash  $artifact"

      - name: Upload release binary
        uses: actions/upload-artifact@v7
        with:
          name: v_fs_backup-${{ matrix.name }}
          path: versions/v_fs_backup_v*/v_fs_backup_v*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download release binaries
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release-assets-flat
          find release-assets -type f -name 'v_fs_backup_v*' -exec cp -f {} release-assets-flat/ \;

          asset_count=$(find release-assets-flat -maxdepth 1 -type f | wc -l)
          if [ "$asset_count" -eq 0 ]; then
            echo "No release assets found under release-assets" >&2
            find release-assets -maxdepth 4 -print >&2
            exit 1
          fi

          find release-assets-flat -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          name: v_fs_backup ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          generate_release_notes: true
          files: release-assets-flat/*
          fail_on_unmatched_files: true
