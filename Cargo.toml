[package]
name = "v_fs_backup"
version = "0.1.10"
edition = "2024"

[dependencies]
rustyline = "18.0.1"
v_concat = "0.1.3"
zstd = { version = "0.13.3", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[profile.dev]
incremental = false

[profile.test]
incremental = false

[profile.release]
lto = false
codegen-units = 16
incremental = false
strip = "none"
